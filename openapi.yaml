openapi: 3.0.3
info:
  title: Example API
  version: 1.0.0
  description: A simple API with POST and GET methods for managing example entities.

servers:
  - url: https://api.example.com/v1

paths:
  /example:
    post:
      summary: Create a new example entity
      requestBody:
        description: Example entity to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewExample'
      responses:
        '201':
          description: Entity created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example'
        '400':
          description: Invalid input

  /example/{id}:
    get:
      summary: Get an example entity by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the example entity
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully retrieved entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example'
        '404':
          description: Entity not found

components:
  schemas:
    NewExample:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Sample Name"
        description:
          type: string
          example: "This is a sample entity."
    Example:
      allOf:
        - $ref: '#/components/schemas/NewExample'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 123
